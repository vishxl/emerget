<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      width: 360px; margin: 0;
      font: 13px/1.45 -apple-system, system-ui, sans-serif;
      background: #0b0d12; color: #e7ecf3;
    }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 10px;
      background: linear-gradient(180deg, #141a26 0%, #0b0d12 100%);
      border-bottom: 1px solid #1c2330;
    }
    header img { width: 28px; height: 28px; border-radius: 8px; }
    header h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: .2px; }
    header span { color: #5d6b80; font-size: 11px; }

    main { padding: 12px 16px 16px; }

    #status {
      color: #8b97a8; font-size: 12px; min-height: 17px; margin-bottom: 8px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #bar {
      height: 5px; background: #161c28; border-radius: 3px;
      overflow: hidden; margin-bottom: 12px;
    }
    #bar i {
      display: block; height: 100%; width: 0; border-radius: 3px;
      background: linear-gradient(90deg, #1e64fa, #4f8bff);
      transition: width .35s ease;
    }

    button {
      padding: 9px 10px; border: 1px solid #232b3b; border-radius: 10px;
      background: #151b28; color: #e7ecf3;
      font-size: 12.5px; font-weight: 500; cursor: pointer;
      transition: background .15s, border-color .15s, transform .05s;
    }
    button:hover:not(:disabled) { background: #1c2434; border-color: #2e3a52; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .38; cursor: default; }
    .btns { display: flex; gap: 8px; }
    .btns button { flex: 1; }

    #primary {
      width: 100%; padding: 11px; margin-bottom: 12px;
      background: linear-gradient(135deg, #1e64fa, #3f7bff);
      border: none; border-radius: 11px;
      font-size: 13.5px; font-weight: 600; color: #fff;
      box-shadow: 0 2px 10px rgba(30, 100, 250, .25);
    }
    #primary:hover:not(:disabled) { background: linear-gradient(135deg, #2b70ff, #548aff); }

    select {
      width: 100%; margin-bottom: 10px; padding: 8px 10px;
      background: #151b28; color: #e7ecf3;
      border: 1px solid #232b3b; border-radius: 10px;
      font-size: 12.5px; cursor: pointer;
    }
    select:focus { outline: none; border-color: #1e64fa; }

    #preview {
      max-height: 130px; overflow-y: auto;
      font-size: 11.5px; color: #97a3b5; white-space: pre-wrap;
      background: #10141d; border: 1px solid #1c2330; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    #meta { color: #5d6b80; font-size: 11px; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" />
    <div>
      <h1>Emerget</h1>
      <span>export your Emergent chats</span>
    </div>
  </header>
  <main>
    <div id="status">Ready.</div>
    <div id="bar"><i></i></div>
    <button id="primary">Capture full chat</button>
    <select id="fmt">
      <option value="transcript">Transcript — .txt</option>
      <option value="markdown">Markdown — .md</option>
      <option value="resume">Resume prompt — .txt</option>
      <option value="json">JSON — .json</option>
    </select>
    <div id="preview" hidden></div>
    <div class="btns">
      <button id="copy" disabled>Copy</button>
      <button id="download" disabled>Download</button>
    </div>
    <div id="meta"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
